
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTFL | Panel Privado</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#090d16;color:white;font-family:Arial,sans-serif;padding:25px}
main{max-width:850px;margin:70px auto;background:#111827;border:1px solid #273449;border-radius:15px;padding:30px}
h1{color:#60a5fa;margin-bottom:10px}
p{color:#9ca3af;margin:12px 0 22px}
button{padding:13px 20px;border:0;border-radius:8px;background:#5865f2;color:white;font-weight:bold;cursor:pointer}
button:hover{background:#4752c4}
.hidden{display:none!important}
#status{margin-top:20px;color:#d1d5db;line-height:1.5}
.panel-section{background:#1f2937;border-radius:10px;padding:20px;margin-top:20px}
.logout{background:#374151;margin-top:20px}
</style>
</head>
<body>
<main>
<h1>GTFL</h1>
<h2>Panel privado de la liga</h2>
<p>Acceso exclusivo para árbitros y directiva.</p>

<button id="login">Iniciar sesión con Discord</button>
<div id="status">Verificando acceso...</div>

<section id="privatePanel" class="hidden">
  <div class="panel-section">
    <h2>Acceso autorizado</h2>
    <p id="identity"></p>
    <p id="role"></p>
  </div>

  <div id="refereeArea" class="panel-section hidden">
    <h2>Zona de árbitros</h2>
    <p>Acceso autorizado para consultar partidos y enviar informes.</p>
  </div>

  <div id="adminArea" class="panel-section hidden">
    <h2>Zona de dirección</h2>
    <p>Acceso autorizado para gestionar verificaciones.</p>
  </div>

  <button class="logout" id="logout">Cerrar sesión</button>
</section>
</main>

<script type="module">
import {createClient} from "https://esm.sh/@supabase/supabase-js@2";

const supabase=createClient(
  "https://ruusgcicoscnaydsimve.supabase.co",
  "sb_publishable_RjKrgG_mX_XfW9QQGJmJcQ_325gNLq4"
);

const login=document.getElementById("login");
const status=document.getElementById("status");
const privatePanel=document.getElementById("privatePanel");

login.addEventListener("click",async()=>{
  status.textContent="Conectando con Discord...";
  const {error}=await supabase.auth.signInWithOAuth({
    provider:"discord",
    options:{redirectTo:window.location.href}
  });
  if(error) status.textContent="Error: "+error.message;
});

async function checkAccess(){
  privatePanel.classList.add("hidden");
  document.getElementById("refereeArea").classList.add("hidden");
  document.getElementById("adminArea").classList.add("hidden");

  const {data,error}=await supabase.auth.getSession();

  if(error || !data.session){
    login.classList.remove("hidden");
    status.textContent="Inicia sesión con tu cuenta de Discord para comprobar tus permisos.";
    return;
  }

  login.classList.add("hidden");
  status.textContent="Comprobando permisos de GTFL...";

  const {data:result,error:functionError}=await supabase.functions.invoke("gtfl-panel");

  if(functionError || !result || !result.authenticated){
    status.textContent="No se ha podido verificar tu cuenta. Cierra sesión e inténtalo de nuevo.";
    return;
  }

  if(!result.isReferee && !result.canApprove){
    status.textContent="Acceso denegado. Tu cuenta no tiene un rol autorizado en GTFL.";
    return;
  }

  privatePanel.classList.remove("hidden");
  status.textContent="";

  document.getElementById("identity").textContent="Discord ID: "+result.discordId;

  if(result.isReferee){
    document.getElementById("refereeArea").classList.remove("hidden");
  }

  if(result.canApprove){
    document.getElementById("adminArea").classList.remove("hidden");
  }

  document.getElementById("role").textContent=
    result.canApprove ? "Permiso de dirección autorizado" : "Árbitro autorizado";
}

document.getElementById("logout").addEventListener("click",async()=>{
  await supabase.auth.signOut();
  window.location.reload();
});

checkAccess();
</script>
</body>
</html>
