<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GTFL | Glory Touch Football League</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.78)
                ),
                url("background.jpg") center center / cover fixed no-repeat;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 45px 20px;
        }

        .logo {
            width: 190px;
            max-width: 70%;
            height: auto;
            margin-bottom: 18px;
        }

        .title {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: 5px;
            text-align: center;
        }

        .subtitle {
            margin-top: 10px;
            font-size: 15px;
            letter-spacing: 2px;
            opacity: 0.7;
            text-align: center;
        }

        .navigation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin-top: 50px;
            max-width: 900px;
        }

        .nav-button {
            min-width: 170px;
            padding: 17px 25px;

            color: white;
            text-decoration: none;
            text-align: center;

            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1.5px;

            background: rgba(255, 255, 255, 0.09);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 10px;

            backdrop-filter: blur(10px);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                border-color 0.2s ease;
        }

        .nav-button:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.17);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .info {
            margin-top: 65px;
            max-width: 650px;
            text-align: center;

            padding: 25px;

            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;

            backdrop-filter: blur(8px);
        }

        .info h2 {
            font-size: 20px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .info p {
            font-size: 14px;
            line-height: 1.7;
            opacity: 0.75;
        }

        .footer {
            margin-top: auto;
            padding-top: 70px;

            font-size: 12px;
            letter-spacing: 1px;
            opacity: 0.45;

            text-align: center;
        }

        @media (max-width: 600px) {

            .page {
                padding: 35px 15px;
            }

            .logo {
                width: 145px;
            }

            .title {
                font-size: 32px;
                letter-spacing: 3px;
            }

            .subtitle {
                font-size: 12px;
            }

            .navigation {
                width: 100%;
                margin-top: 35px;
            }

            .nav-button {
                width: 90%;
                max-width: 320px;
            }

            .info {
                margin-top: 45px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <img
            src="logo.png"
            class="logo"
            alt="GTFL Logo"
        >

        <h1 class="title">GTFL</h1>

        <p class="subtitle">
            GLORY TOUCH FOOTBALL LEAGUE
        </p>

        <nav class="navigation">

            <a href="rules.html" class="nav-button">
                RULES
            </a>

            <a href="#" class="nav-button">
                RESULTS
            </a>

            <a href="#" class="nav-button">
                SQUADS
            </a>

        </nav>

        <section class="info">

            <h2>Official GTFL Website</h2>

            <p>
                Welcome to the official Glory Touch Football League website.
                Official information, results and team squads will be available here.
            </p>

        </section>

        <footer class="footer">
            GTFL — GLORY TOUCH FOOTBALL LEAGUE
        </footer>

    </main>

</body>
</html>
